name: Smoke Test Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-test-gate:
    name: Run Smoke & API Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python for RTM Reconciliation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Install Playwright System Dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps chromium"

      - name: Execute API Integration Suite
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mvn clean test -DsuiteFile=src/test/resources/suites/api.xml \
            -DbaseUrl=https://demo.nopcommerce.com \
            -DadminUrl=https://admin-demo.nopcommerce.com/admin/ \
            -Dheadless=true \
            -DbrowserChannel=none

      - name: Run RTM Reconciliation Script
        if: always()
        run: |
          python scripts/reconcile_rtm.py

      - name: Publish TestNG / Surefire XML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: |
            target/surefire-reports/
            evidence/reports/
            evidence/surefire-reports/

      - name: Publish Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results/

      - name: Publish Failure Evidence & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-artifacts
          path: |
            evidence/failures/
            docs/traceability-matrix.md
            docs/execution-summary.md
