name: Jenkins CI Pipeline Trigger

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG Suite to run on Jenkins'
        required: false
        default: 'suites/smoke.xml'
      browser:
        description: 'Browser family'
        required: false
        default: 'chromium'

jobs:
  trigger-jenkins:
    name: Dispatch Jenkins Automation Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUITE: ${{ github.event.inputs.suite || 'suites/smoke.xml' }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}

    steps:
      - name: Trigger Jenkins Pipeline Webhook
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Initiating Jenkins Pipeline Trigger ==="
          if [[ -z "${JENKINS_URL:-}" ]]; then
            echo "::notice::Jenkins is not configured; skipping the optional Jenkins build dispatch."
            exit 0
          fi

          if [[ -z "${JENKINS_USER:-}" || -z "${JENKINS_TOKEN:-}" ]]; then
            echo "::error::JENKINS_URL is configured, but JENKINS_USER or JENKINS_API_TOKEN is missing."
            exit 1
          fi

          case "$SUITE" in
            suites/regression.xml|suites/smoke.xml|suites/api.xml|suites/ui.xml|suites/db.xml|suites/nfr.xml|suites/a11y.xml) ;;
            *) echo "::error::Unsupported TestNG suite: $SUITE"; exit 1 ;;
          esac
          case "$BROWSER" in
            chromium|firefox|webkit) ;;
            *) echo "::error::Unsupported browser: $BROWSER"; exit 1 ;;
          esac

          JENKINS_URL="${JENKINS_URL%/}"
          BUILD_URL="$JENKINS_URL/job/nopCommerce-E2E-Automation-Pipeline/buildWithParameters"
          RESPONSE_FILE="$RUNNER_TEMP/jenkins-trigger-response.txt"
          AUTH_CONFIG="$(printf 'user = \"%s:%s\"\n' "$JENKINS_USER" "$JENKINS_TOKEN")"

          if ! STATUS="$(printf '%s' "$AUTH_CONFIG" | curl --config - --silent --show-error \
            --output "$RESPONSE_FILE" --write-out '%{http_code}' --request POST \
            --data-urlencode "SUITE=$SUITE" --data-urlencode "BROWSER=$BROWSER" "$BUILD_URL")"; then
            echo "::error::Could not contact Jenkins or authenticate the build request."
            exit 1
          fi

          echo "Jenkins build-dispatch HTTP status: $STATUS"
          case "$STATUS" in
            200|201|202) echo "Jenkins accepted the build request for $SUITE on $BROWSER. This workflow does not wait for or verify the Jenkins test result." ;;
            *) echo "::error::Jenkins rejected the build request (HTTP $STATUS)."; exit 1 ;;
          esac
