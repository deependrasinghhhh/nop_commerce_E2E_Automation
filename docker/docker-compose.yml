services:
  nopcommerce_database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nopcommerce_mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment or .env file}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    networks:
      - qa
    volumes:
      - nopcommerce_db_data:/var/opt/mssql
      - ./seed:/docker-seed:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U \"${DB_USER:-sa}\" -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nopcommerce_web:
    image: nopcommerceteam/nopcommerce:4.90.8
    container_name: nopcommerce_web
    depends_on:
      nopcommerce_database:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:80"
    networks:
      - qa
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__ConnectionString: "Data Source=nopcommerce_database;Initial Catalog=nopcommerce_db;Integrated Security=False;Persist Security Info=False;User ID=${DB_USER:-sa};Password=${DB_PASSWORD:?Set DB_PASSWORD in the environment or .env file};Trust Server Certificate=True"
    volumes:
      - nopcommerce_app_data:/app/App_Data
      - ./seed:/docker-seed:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

volumes:
  nopcommerce_db_data:
    driver: local
  nopcommerce_app_data:
    driver: local

networks:
  qa:
    name: docker_qa-network
    external: true
