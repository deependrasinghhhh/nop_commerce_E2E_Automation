version: '3.8'

services:
  nopcommerce_database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nopcommerce_mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=NopCommerce@2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - nopcommerce_db_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P NopCommerce@2026! -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P NopCommerce@2026! -Q 'SELECT 1' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nopcommerce_web:
    image: nopcommerceteam/nopcommerce:4.90.8
    container_name: nopcommerce_web
    depends_on:
      nopcommerce_database:
        condition: service_healthy
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - nopcommerce_app_data:/app/App_Data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

volumes:
  nopcommerce_db_data:
    driver: local
  nopcommerce_app_data:
    driver: local
