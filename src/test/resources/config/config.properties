# nopCommerce QA Framework – Baseline Non-Secret Configuration
# Credentials and secrets (adminEmail, adminPassword, dbUser, dbPassword) MUST be
# provided via environment variables, CI secret stores, or a local git-ignored .env file.
# No credential defaults or fallbacks are stored in this file.

baseUrl=http://127.0.0.1:5000
adminUrl=http://127.0.0.1:5000/Admin
browser=chromium
browserChannel=none
browserArgs=
cdpUrl=none
headless=true
ignoreHttpsErrors=false
slowMo=0
defaultTimeout=60000

# MSSQL Database Non-Secret Connection Settings (for isolated container execution)
dbHost=127.0.0.1
dbPort=1433
dbName=nopcommerce_db
dbEncrypt=false
dbTrustServerCertificate=true

# Execution & Evidence Settings
captureScreenshotOnFailure=true
recordTrace=true
recordVideo=false
allureTrendHistory=true
testEnvName=isolated-docker

# Accessibility Threshold Settings
a11y.failOnImpact=critical

