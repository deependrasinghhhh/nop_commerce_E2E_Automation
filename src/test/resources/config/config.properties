# nopCommerce QA Framework — Baseline Configuration
# Credentials and secrets MUST be provided via .env or environment variables.
# See .env.example for the full list of supported keys.

baseUrl=http://127.0.0.1:5000
adminUrl=http://127.0.0.1:5000/Admin
browser=chromium
browserChannel=none
cdpUrl=none
headless=true
slowMo=0
defaultTimeout=45000

# Admin email (public nopCommerce demo default — non-secret)
adminEmail=admin@yourstore.com
# adminPassword — supply via .env or ADMIN_PASSWORD env var

# MSSQL Database Configuration (for container execution)
dbHost=127.0.0.1
dbPort=1433
dbName=nopcommerce_db
dbUser=sa
# dbPassword — supply via .env or DB_PASSWORD env var
dbEncrypt=false
dbTrustServerCertificate=true

# Execution Settings
captureScreenshotOnFailure=true
recordTrace=true
